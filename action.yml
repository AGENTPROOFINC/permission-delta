name: Permission Delta
description: Review MCP server configuration changes in a pull request
inputs:
  fail-on:
    description: Fail when the report contains findings at or above this severity
    required: false
    default: never
runs:
  using: composite
  steps:
    - name: Validate pull request context
      shell: bash
      env:
        EVENT_NAME: ${{ github.event_name }}
        BASE_SHA: ${{ github.event.pull_request.base.sha }}
        BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
        HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
      run: |
        set -euo pipefail
        if [[ "$EVENT_NAME" != "pull_request" ]]; then
          echo "Permission Delta must run on a pull_request event." >&2
          exit 2
        fi
        if [[ -z "$BASE_SHA" || -z "$BASE_REPOSITORY" || -z "$HEAD_SHA" || -z "$HEAD_REPOSITORY" ]]; then
          echo "Pull request base or head metadata is unavailable." >&2
          exit 2
        fi

    - name: Check out trusted base snapshot
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ github.event.pull_request.base.repo.full_name }}
        ref: ${{ github.event.pull_request.base.sha }}
        path: .permission-delta/base
        persist-credentials: false

    - name: Check out proposed snapshot as data
      uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      with:
        repository: ${{ github.event.pull_request.head.repo.full_name }}
        ref: ${{ github.event.pull_request.head.sha }}
        path: .permission-delta/proposed
        persist-credentials: false

    - name: Set up Python
      uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
      with:
        python-version: "3.12"

    - name: Compare MCP configurations
      shell: bash
      env:
        PYTHONPATH: ${{ github.action_path }}/src
        FAIL_ON: ${{ inputs.fail-on }}
      run: |
        set -euo pipefail
        case "$FAIL_ON" in
          never|low|medium|high) ;;
          *) echo "fail-on must be never, low, medium, or high." >&2; exit 2 ;;
        esac
        set +e
        python -m permission_delta tree-diff \
          --before-dir "$GITHUB_WORKSPACE/.permission-delta/base" \
          --after-dir "$GITHUB_WORKSPACE/.permission-delta/proposed" \
          --format markdown \
          --output "$RUNNER_TEMP/permission-delta-report.md" \
          --fail-on "$FAIL_ON"
        result=$?
        set -e
        cat "$RUNNER_TEMP/permission-delta-report.md" >> "$GITHUB_STEP_SUMMARY"
        exit "$result"
