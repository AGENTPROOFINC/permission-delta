name: Permission Delta

on:
  pull_request:
    types: [opened, synchronize, reopened]

# Read-only permissions. Do not switch this workflow to pull_request_target.
permissions:
  contents: read

jobs:
  permission-review:
    name: Review MCP configuration changes
    runs-on: ubuntu-latest
    steps:
      # The action and scanner are checked out from the trusted base revision.
      - name: Check out trusted Permission Delta action
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: .permission-delta-action
          persist-credentials: false

      - name: Review MCP configuration changes
        uses: ./.permission-delta-action
        with:
          fail-on: never
