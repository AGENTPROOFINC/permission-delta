name: One-time history cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-and-audit:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Check out all refs
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true
      - name: Audit every reachable commit and rewrite metadata
        env:
          TARGET_EMAIL: "356405622+AGENTPROOFINC@users.noreply.github.com"
        shell: bash
        run: |
          set -euo pipefail
          expected_head="$(git ls-remote origin refs/heads/main | awk '{print $1}')"
          test -n "$expected_head"
          test "$(git rev-parse HEAD)" = "$expected_head"

          python3 - <<'PY'
          import re
          import subprocess
          import sys

          commits = subprocess.check_output(
              ["git", "rev-list", "--all"], text=True
          ).splitlines()
          bad_names = []
          bad_blobs = set()
          email_findings = set()
          sensitive_name = re.compile(
              r"(^|/)(\.env|\.npmrc|\.pypirc|id_rsa|id_ed25519|credentials?[^/]*|secrets?[^/]*|.*\.(pem|key|p12|pfx))$",
              re.I,
          )
          secret_patterns = [
              re.compile(rb"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(rb"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(rb"\b(?:gh[pousr]_[A-Za-z0-9]{30,}|github_pat_[A-Za-z0-9_]{40,})\b"),
              re.compile(rb"\bxox[baprs]-[A-Za-z0-9-]{20,}\b"),
              re.compile(rb"\bsk-(?:proj-)?[A-Za-z0-9_-]{32,}\b"),
              re.compile(rb"\bBearer\s+[A-Za-z0-9._~+/=-]{32,}", re.I),
          ]
          email_re = re.compile(rb"[A-Z0-9._%+-]+@[A-Z0-9.-]+\.[A-Z]{2,}", re.I)
          allowed_domains = (b"example.com", b"example.org", b"example.net", b"localhost")
          blob_ids = set()
          for commit in commits:
              paths = subprocess.check_output(
                  ["git", "ls-tree", "-r", "--name-only", commit], text=True
              ).splitlines()
              for path in paths:
                  if sensitive_name.search(path) and not re.search(
                      r"(example|sample|template|test|fixture)", path, re.I
                  ):
                      bad_names.append(path)
              listing = subprocess.check_output(
                  ["git", "ls-tree", "-r", commit], text=True
              )
              for line in listing.splitlines():
                  fields = line.split()
                  if len(fields) >= 3 and fields[1] == "blob":
                      blob_ids.add(fields[2])

          for blob in blob_ids:
              data = subprocess.check_output(["git", "cat-file", "blob", blob])
              if any(pattern.search(data) for pattern in secret_patterns):
                  bad_blobs.add(blob)
              for match in email_re.findall(data):
                  address = match.lower()
                  if not any(address.endswith(b"@" + domain) for domain in allowed_domains):
                      if b"users.noreply.github.com" not in address:
                          email_findings.add(address)

          print(
              "history audit:",
              f"commits={len(commits)}",
              f"unique_blobs={len(blob_ids)}",
              f"sensitive_paths={len(bad_names)}",
              f"secret_pattern_blobs={len(bad_blobs)}",
              f"non_example_content_emails={len(email_findings)}",
          )
          if bad_names or bad_blobs or email_findings:
              print("Audit failed; values omitted from logs.")
              sys.exit(1)
          PY

          git filter-branch -f --env-filter '
            export GIT_AUTHOR_EMAIL="$TARGET_EMAIL"
            export GIT_COMMITTER_EMAIL="$TARGET_EMAIL"
          ' -- --all
          for ref in $(git for-each-ref --format='%(refname)' refs/original); do
            git update-ref -d "$ref"
          done
          git reflog expire --expire=now --all
          git gc --prune=now

          # Remove this one-time credentialed workflow before publishing the rewritten ref.
          git rm .github/workflows/rewrite-history.yml
          git -c user.name="AGENTPROOFINC" -c user.email="$TARGET_EMAIL" commit -m "Remove one-time history cleanup workflow"

          unexpected="$(git log --all --format='%ae%n%ce' | grep -Fvx "$TARGET_EMAIL" || true)"
          if [ -n "$unexpected" ]; then
            echo "Unexpected author or committer metadata remains; push aborted."
            exit 1
          fi
          test -z "$(git ls-files .github/workflows/rewrite-history.yml)"

          git push --force-with-lease="refs/heads/main:$expected_head" origin HEAD:refs/heads/main
